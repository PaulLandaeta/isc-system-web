name: Deploy to Vercel

on:
  push:
    branches:
      - feat/devops/#603-Deploy-Vercel-Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: 
      name: production
      url: ${{ steps.deploy.outputs.vercel-url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project
        run: vercel pull --yes --token ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOY_URL=$(vercel --prod --yes --token ${{ secrets.VERCEL_TOKEN }} | grep -o 'https://[^ ]*')
          echo "vercel-url=$DEPLOY_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}